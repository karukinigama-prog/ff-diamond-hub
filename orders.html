<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders — FF Diamond Hub</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#00e5ff"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    .orders-section { padding: 30px 0 60px; }
    .wallet-bar {
      background: linear-gradient(135deg, #0a1a20, #0d1520);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .wallet-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .wallet-amount { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--cyan); }
    .wallet-icon { font-size: 32px; }
    .order-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .order-card:hover { border-color: #333; }
    .order-info { flex: 1; min-width: 0; }
    .order-pkg { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .order-meta { font-size: 12px; color: var(--text-muted); }
    .order-meta span { margin-right: 10px; }
    .order-right { text-align: right; flex-shrink: 0; }
    .order-price { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .status-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-badge.PENDING  { background: #2a1f00; color: #fbbf24; border: 1px solid #fbbf2444; }
    .status-badge.SUCCESS  { background: #002a1a; color: #4ade80; border: 1px solid #4ade8044; }
    .status-badge.FAILED   { background: #2a0000; color: #f87171; border: 1px solid #f8717144; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; margin-bottom: 20px; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-body);
    }
    .filter-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-glow); }
    .loading-spinner { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none">
          <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
          <text x="16" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#00e5ff" font-family="Rajdhani">FF</text>
        </svg>
      </div>
      <span class="brand-name">FF Diamond<span class="brand-accent">Hub</span></span>
    </a>
    <div class="nav-right">
      <a href="index.html" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← Home</a>
      <button class="btn-admin" onclick="handleLogout()">Logout</button>
    </div>
  </div>
</nav>

<section class="orders-section">
  <div class="container">
    <h2 class="section-title">My Orders</h2>
    <p class="section-sub">Track your diamond top-up history</p>

    <!-- Wallet Balance -->
    <div class="wallet-bar">
      <div>
        <div class="wallet-label">Wallet Balance</div>
        <div class="wallet-amount">LKR <span id="walletBalance">0.00</span></div>
      </div>
      <div class="wallet-icon">💎</div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-btn active" onclick="filterOrders('ALL', this)">All</button>
      <button class="filter-btn" onclick="filterOrders('PENDING', this)">⏳ Pending</button>
      <button class="filter-btn" onclick="filterOrders('SUCCESS', this)">✅ Success</button>
      <button class="filter-btn" onclick="filterOrders('FAILED', this)">❌ Failed</button>
    </div>

    <!-- Orders List -->
    <div id="ordersList">
      <div class="loading-spinner">Loading orders...</div>
    </div>

  </div>
</section>

<!-- Footer -->
<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-copy">
      <span>© 2025 FF Diamond Hub</span>
      <span class="footer-divider">|</span>
      <span class="created-by">Created by <strong>Hasith</strong></span>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  let allOrders = [];
  let currentUser = null;

  // Init
  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'auth.html'; return; }
    currentUser = session.user;
    await loadWallet();
    await loadOrders();
    // Auto refresh every 15 seconds
    setInterval(async () => { await loadWallet(); await loadOrders(); }, 15000);
  }

  // Load wallet balance
  async function loadWallet() {
    const { data } = await supabase
      .from('profiles')
      .select('wallet_balance')
      .eq('id', currentUser.id)
      .single();
    if (data) document.getElementById('walletBalance').textContent = parseFloat(data.wallet_balance).toFixed(2);
  }

  // Load orders
  async function loadOrders() {
    const { data, error } = await supabase
      .from('orders')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (error) { showToast('Failed to load orders', 'error'); return; }
    allOrders = data || [];
    renderOrders(allOrders);
  }

  // Render orders
  function renderOrders(orders) {
    const list = document.getElementById('ordersList');
    if (orders.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <p>No orders found</p>
          <a href="index.html" class="btn-confirm" style="display:inline-flex;text-decoration:none;width:auto;padding:12px 28px;">
            Place First Order →
          </a>
        </div>`;
      return;
    }

    list.innerHTML = orders.map(order => {
      const date = new Date(order.created_at).toLocaleDateString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      return `
        <div class="order-card">
          <div class="order-info">
            <div class="order-pkg">💎 ${order.package_name}</div>
            <div class="order-meta">
              <span>UID: ${order.player_uid}</span>
              <span>${date}</span>
            </div>
            <div class="order-meta" style="margin-top:4px">
              <span style="color:var(--text-dim)">#${order.id.slice(-8).toUpperCase()}</span>
              <span>${order.payment_method === 'CASH' ? '💵 Cash' : '💳 Wallet'}</span>
            </div>
          </div>
          <div class="order-right">
            <div class="order-price">LKR ${order.price}</div>
            <span class="status-badge ${order.status}">${order.status}</span>
          </div>
        </div>`;
    }).join('');
  }

  // Filter orders
  function filterOrders(status, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (status === 'ALL') renderOrders(allOrders);
    else renderOrders(allOrders.filter(o => o.status === status));
  }

  // Logout
  async function handleLogout() {
    await supabase.auth.signOut();
    window.location.href = 'auth.html';
  }

  // Toast
  let toastTimer;
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    if (toastTimer) clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = `toast ${type} show`;
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
  }

  init();
</script>
</body>
</html>
